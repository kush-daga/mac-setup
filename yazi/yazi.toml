# yazi — the file manager. Launch with `y` so the shell follows you out.
# Keys: hjkl move, <enter> open, y/x/p yank/cut/paste, . toggle hidden,
#       / search, s search-by-content, T toggle preview, q quit.
#
# Schema note: this is yazi 26.x. Openers take %s / %s1 / %d1 placeholders,
# NOT shell "$@", and [open] rules match on `url` or `mime` — `name` was
# removed. Check against `yazi-config/preset/yazi-default.toml` upstream
# before adding keys; the schema moves.

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
wrap          = "yes"
tab_size      = 2
max_width     = 1200
max_height    = 1800
image_filter  = "triangle"
image_quality = 80

[opener]
edit = [
  { run = 'nvim %s', desc = "nvim", for = "unix", block = true },
]
open = [
  { run = 'open %s', desc = "system default", for = "macos" },
]
reveal = [
  { run = 'open -R %s1', desc = "reveal in Finder", for = "macos" },
  { run = 'exiftool %s1; echo "Press enter to exit"; read _', desc = "show EXIF", for = "unix", block = true },
]
extract = [
  { run = 'ya pub extract --list %s', desc = "extract here" },
]
play = [
  { run = 'open %s', desc = "play", for = "macos" },
]

[open]
rules = [
  { url = "*/", use = [ "edit", "open", "reveal" ] },

  { mime = "text/*",        use = [ "edit", "reveal" ] },
  { mime = "inode/empty",   use = [ "edit", "reveal" ] },
  { mime = "application/{json,ndjson,javascript,x-yaml,toml,xml}", use = [ "edit", "reveal" ] },

  { mime = "image/*",       use = [ "open", "reveal" ] },
  { mime = "{audio,video}/*", use = [ "play", "reveal" ] },
  { mime = "application/pdf", use = [ "open", "reveal" ] },

  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },

  { url = "*", use = [ "open", "edit", "reveal" ] },
]
