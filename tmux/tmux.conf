# ═══════════════════════════════════════════════════════════════════════
#  tmux — for sessions that must survive: ssh, reboots, long builds.
#  Ghostty's cmd+d splits handle local work; tmux is for persistence.
#  Prefix is ctrl+a, so it never collides with Ghostty's cmd bindings.
#  Reload: prefix + r
# ═══════════════════════════════════════════════════════════════════════

# ── Prefix ───────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix              # ctrl+a ctrl+a reaches the inner shell/nvim

# ── Terminal & colour ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"          # true colour
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-features ",*:usstyle"             # undercurl for diagnostics
set -ga terminal-features ",*:hyperlinks"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Responsiveness (both matter a lot inside nvim) ───────────────────────
set -sg escape-time 0             # no delay after pressing Esc
set -g focus-events on            # lets nvim's autoread and gitsigns fire
set -g repeat-time 400
set -sg repeat-time 400

# ── Sane defaults ────────────────────────────────────────────────────────
set -g history-limit 100000
set -g base-index 1               # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on        # close window 2, window 3 becomes 2
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on       # image protocols / OSC 52 through tmux
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S ⋅ #W"
set -g display-time 2000
set -g display-panes-time 2000
set -g detach-on-destroy off      # closing a session hops to another, not out
setw -g aggressive-resize on

# ── Splits: | is vertical, - is horizontal, both keep the cwd ────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation: vim keys, and alt+arrows without the prefix ─────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Pane resizing (repeatable: hold the key after the prefix) ────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h resize-pane -L 1
bind -r C-j resize-pane -D 1
bind -r C-k resize-pane -U 1
bind -r C-l resize-pane -R 1
bind = select-layout even-horizontal
bind + select-layout even-vertical
bind Space next-layout
bind z resize-pane -Z              # zoom (default, listed for discoverability)
bind ! break-pane                  # pull this pane into its own window
bind @ join-pane -t !              # push it back into the last window

# ── Window navigation ────────────────────────────────────────────────────
bind -r C-n next-window
bind -r C-p previous-window
bind Tab last-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind , command-prompt -I "#W" "rename-window '%%'"
bind < swap-window -d -t -1
bind > swap-window -d -t +1

# ── Sessions ─────────────────────────────────────────────────────────────
bind S command-prompt -p "new session:" "new-session -A -s '%%'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
# prefix+s is tmux's session list; this replaces it with an fzf picker.
bind s display-popup -E -w 60% -h 50% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session ❯ ' | xargs -r tmux switch-client -t"

# ── Popups: a scratch shell and lazygit, over whatever you're doing ──────
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 70%
bind e display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "yazi"

# ── Copy mode: vi keys, y copies to the macOS clipboard ─────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y send -X copy-line-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi / command-prompt -i -p "search ↓" "send -X search-forward-incremental '%%%'"
bind -T copy-mode-vi ? command-prompt -i -p "search ↑" "send -X search-backward-incremental '%%%'"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
bind p paste-buffer -p
bind P choose-buffer -Z

# ── Utility ──────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message " tmux.conf reloaded"
bind C-l send-keys C-l \; clear-history \; display-message " scrollback cleared"
bind ? list-keys -N
# choose-tree is the closest thing to a vertical tab sidebar: a live,
# navigable tree of every session, window and pane. Ghostty itself has no
# sidebar-tab option (checked in 1.2.3), so this is where to get that feel.
bind w choose-tree -Zw
bind W choose-tree -Zs
bind : command-prompt
# Send the pane's scrollback to nvim to search or save it.
bind O run-shell 'tmux capture-pane -pS -100000 > /tmp/tmux-scrollback.txt' \; \
       new-window -n scrollback "nvim /tmp/tmux-scrollback.txt"

# ── Theme (written by the `theme` command; TokyoNight Storm by default) ──
if-shell "[ -f ~/.config/tmux/theme.conf ]" "source-file ~/.config/tmux/theme.conf"

# ── Plugins (tpm) ────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # ctrl+hjkl across nvim+tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # do it automatically
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'                # prefix+u: open any URL onscreen

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '2000'

run '~/.config/tmux/plugins/tpm/tpm'
