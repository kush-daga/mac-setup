# lazygit — the git TUI. Colours are merged in from ~/.config/lazygit/theme.yml
# (generated by `theme`) via $LG_CONFIG_FILE. Keys: `?` in any panel.
gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  scrollHeight: 4
  sidePanelWidth: 0.3
  mainPanelSplitMode: flexible
  language: en
  timeFormat: "2006-01-02 15:04"
  shortTimeFormat: "15:04"
  commitLength:
    show: true
  authorColors:
    "*": "#7aa2f7"
  filterMode: fuzzy
  spinner:
    frames: ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
    rate: 50
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  commit:
    signOff: false
  merging:
    args: ""
  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false
  autoFetch: true
  autoRefresh: true
  fetchAll: true
  parseEmoji: true
  mainBranches: [main, master, development, staging]
update:
  method: never
refresher:
  refreshInterval: 10
  fetchInterval: 60
confirmOnQuit: false
quitOnTopLevelReturn: false
disableStartupPopups: true
notARepository: prompt
promptToReturnFromSubprocess: false
keybinding:
  universal:
    quit: q
    return: <esc>
    edit: e
  files:
    commitChangesWithEditor: C
customCommands:
  - key: "<c-p>"
    context: "global"
    description: "push (force-with-lease)"
    command: "git push --force-with-lease"
    loadingText: "pushing…"
  - key: "n"
    context: "localBranches"
    description: "new branch from default branch"
    prompts:
      - type: "input"
        title: "branch name"
    command: "git switch -c {{index .PromptResponses 0}}"
  - key: "a"
    context: "commits"
    description: "absorb staged changes into the right commits"
    command: "git absorb --and-rebase"
    loadingText: "absorbing…"
  - key: "P"
    context: "global"
    description: "open a pull request"
    command: "gh pr create --fill --web"
    output: terminal
